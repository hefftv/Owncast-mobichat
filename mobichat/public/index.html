<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#000000" />
    <title>Chat</title>
    <link rel="stylesheet" href="./watch.css?v=0.1.5d" />
  </head>
  <body>
    <div class="app">
      <div class="stage">
        <iframe
          id="video-frame"
          src="/embed/video?autoplay=always&initiallyMuted=true"
          title="Stream"
          allow="autoplay; fullscreen; picture-in-picture"
          allowfullscreen
          referrerpolicy="origin"
        ></iframe>
        <a class="back" href="/">Back</a>
      </div>

      <iframe
        class="chat"
        id="chat-frame"
        src="/embed/chat/readwrite"
        title="Chat"
        referrerpolicy="origin"
      ></iframe>
    </div>
    <script src="./viewport-fit.js?v=0.1.5d"></script>
    <script src="./watch.js?v=0.1.5d"></script>
  </body>
</html>
